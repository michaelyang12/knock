[package]
name = "knock"
version = "0.3.0"
edition = "2024"
description = "Describe a shell command in plain language, get the command back."
repository = "https://github.com/michaelyang12/knock"
license = "MIT"

[[bin]]
name = "kn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
colored = "3.1.1"
conduit = { git = "https://github.com/michaelyang12/conduit.git" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
